name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/new-session-9vfvqy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled,
# so a deploy is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # A project Pages site is served from /{repo}/, so the build is given
      # that prefix. Authored URLs stay root-absolute either way — see
      # lib/base-path.js.
      - name: Build site and search index
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Verify URL contract and internal links
        run: npm run verify:links
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
