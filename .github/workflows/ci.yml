name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site and search index
        run: npm run build

      - name: Verify URL contract and internal links
        run: npm run verify:links

      # Strict: a network error means the check did not happen, and an
      # unverified BGG ID must not pass as a verified one.
      - name: Verify BoardGameGeek IDs
        run: npm run verify:bgg:strict

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
